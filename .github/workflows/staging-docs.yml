# Publishes a Fern staging preview of docs.nvidia.com/ccluster on
# default-branch pushes that touch docs or fern/.
# Requires the FERN_TOKEN repo secret.

name: staging-docs

on:
  push:
    branches:
      - '**'
    paths:
      - 'docs/**'
      - 'fern/**'
      - '.github/workflows/staging-docs.yml'
  workflow_dispatch: {}

permissions:
  contents: read

# Prevent overlapping deployments; newer runs can replace a pending run.
concurrency:
  group: staging-docs
  cancel-in-progress: false

jobs:
  run:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install Fern CLI tool
        shell: bash
        run: |
          VERSION=$(jq -er '.version | select(type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' fern/fern.config.json) || {
            echo "::error::Set version to an exact x.y.z CLI version in fern/fern.config.json."
            exit 1
          }
          npm install -g "fern-api@$VERSION"

      - name: Generate staging preview
        shell: bash
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: |
          : "${FERN_TOKEN:?Set the FERN_TOKEN repository secret before deploying.}"
          # bash -eo pipefail keeps Fern failures fatal while tee shows the logs.
          # For multi-source sites, prefix this ID with a repository identifier.
          fern generate --docs --preview --id staging 2>&1 | tee fern-output.txt
          URL=$(sed -nE 's/.*Published docs to (https:\/\/[^[:space:]]+).*/\1/p' fern-output.txt | head -n 1)
          if [ -z "$URL" ]; then
            echo "::error::Fern did not return a staging URL. Check the logs above and FERN_TOKEN."
            exit 1
          fi
          # The URL is written to the run summary, so only accept https Fern hosts without userinfo.
          node -e "
            const u = new URL(process.argv[1]);
            const ok = u.protocol === 'https:' && !u.username && !u.password && u.hostname.endsWith('.buildwithfern.com');
            process.exit(ok ? 0 : 1);
          " "$URL" || { echo "::error::Unexpected staging URL host: $URL"; exit 1; }
          echo "Staging URL: $URL"
          echo "🌿 Staging your docs: $URL" >> "$GITHUB_STEP_SUMMARY"
