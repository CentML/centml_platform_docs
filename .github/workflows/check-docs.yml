# Validates Fern docs on every PR and on default-branch pushes.
# Requires the FERN_TOKEN repo secret (from `fern token` for the nvidia
# Fern org). Without it, `fern check` skips the authenticated missing-redirects
# check.

name: fern-check

on:
  pull_request:
  push:
    branches:
      - '**'
  workflow_dispatch: {}
  # Called by publish-docs so published revisions pass the same checks.
  workflow_call:
    secrets:
      FERN_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  run:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_call' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install Fern CLI tool
        shell: bash
        run: |
          VERSION=$(jq -er '.version | select(type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' fern/fern.config.json) || {
            echo "::error::Set version to an exact x.y.z CLI version in fern/fern.config.json."
            exit 1
          }
          npm install -g "fern-api@$VERSION"

      - name: Check API is valid
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
        run: fern check

      - name: Check MDX validity
        run: fern docs md check

      - name: Check MDX safety
        run: python3 tools/check-docs-mdx docs/

      - name: Check docs paths stay inside docs/
        run: python3 tools/check-docs-paths --allow '../docs/index.yml' docs fern

      - name: Check broken links
        # Without --strict the command reports broken links but exits 0.
        run: fern docs broken-links --strict
